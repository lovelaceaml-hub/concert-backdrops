[project]
name = "concert-video-pipeline"
version = "0.1.0"
description = "Deterministic cloud-first video production for Concert Backdrops"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
legacy = [
  "moderngl>=5.12,<6",
  "librosa>=0.11,<0.12",
  "fonttools>=4.55,<5",
  "brotli>=1.1,<2",
  "soundfile>=0.13,<0.14",
]

[project.scripts]
video = "pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.uv]
package = true
