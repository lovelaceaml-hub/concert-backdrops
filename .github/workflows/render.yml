name: Render

# Manual only. Renders still frames or a video for one song in the cloud (no graphics card needed).
# Inputs are passed through environment variables and checked before use (Astra round 0, finding 13).
on:
  workflow_dispatch:
    inputs:
      song:
        description: "Song file in engine/songs, without .py (for example s05_god_bless_you)"
        required: true
        default: s03_original
      audio:
        description: "Audio file in the repo that the video follows (for example audio/promo/s05.mp3)"
        required: true
        default: audio/test/s03-newsong-first-60s.mp3
      mode:
        description: "stills or video"
        required: true
        default: stills
      stills:
        description: "Seconds to render as still frames (stills mode)"
        required: false
        default: "2,8,15,25,35,45,55"
      name:
        description: "Name for the output files"
        required: true
        default: test

env:
  SONG: ${{ inputs.song }}
  AUDIO: ${{ inputs.audio }}
  MODE: ${{ inputs.mode }}
  STILLS: ${{ inputs.stills }}
  OUTNAME: ${{ inputs.name }}
  FEATURES: ${{ github.workspace }}/work/${{ inputs.song }}/features.npz
  LIBGL_ALWAYS_SOFTWARE: "1"
  PARTS: "4"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      frames: ${{ steps.n.outputs.frames }}
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        run: |
          [[ "$SONG" =~ ^[a-z0-9_]+$ ]] || { echo "bad song name"; exit 1; }
          [[ -f "engine/songs/$SONG.py" ]] || { echo "no such song file"; exit 1; }
          [[ "$AUDIO" =~ ^audio/[A-Za-z0-9_./-]+\.mp3$ && "$AUDIO" != *..* && -f "$AUDIO" ]] || { echo "bad audio path"; exit 1; }
          [[ "$MODE" == stills || "$MODE" == video ]] || { echo "bad mode"; exit 1; }
          [[ "$STILLS" =~ ^[0-9.,]*$ ]] || { echo "bad stills list"; exit 1; }
          [[ "$OUTNAME" =~ ^[A-Za-z0-9\ _.,!\'-]+$ ]] || { echo "bad output name"; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q numpy
      - id: n
        run: echo "frames=$(cd engine && python -c 'import song; print(song.NFRAMES)')" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        part: ${{ inputs.mode == 'video' && fromJSON('[0,1,2,3]') || fromJSON('[0]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System packages (software graphics, ffmpeg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2 libgl1-mesa-dri libegl-mesa0 ffmpeg >/dev/null
      - name: Python packages
        run: pip install -q numpy scipy librosa moderngl pillow fonttools brotli soundfile
      - name: Fonts
        run: |
          mkdir -p /tmp/fs && cd /tmp/fs && npm pack -q @fontsource/cormorant-garamond @fontsource/jost >/dev/null
          for f in *.tgz; do d="${f%.tgz}"; mkdir -p "$d"; tar xzf "$f" -C "$d"; done
          cd "$GITHUB_WORKSPACE" && python tools/setup_fonts.py /tmp/fs fonts
      - name: Measure the music
        run: |
          mkdir -p "work/$SONG"
          ffmpeg -v error -y -i "$AUDIO" -ac 1 -ar 22050 "work/$SONG/audio.wav"
          python engine/analyze.py "work/$SONG/audio.wav" "work/$SONG/features.npz" | head -40
      - name: Stills
        if: inputs.mode == 'stills'
        run: cd engine && python render.py --stills "$STILLS" --outdir "../out/${OUTNAME}-stills"
      - name: Video part
        if: inputs.mode == 'video'
        env:
          FRAMES: ${{ needs.prepare.outputs.frames }}
          PART: ${{ matrix.part }}
        run: |
          A=$(( FRAMES * PART / PARTS )); B=$(( FRAMES * (PART + 1) / PARTS ))
          mkdir -p out && cd engine && python render.py --range "$A" "$B" --out "../out/part$PART.mp4" --crf 16
          n=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "../out/part$PART.mp4")
          [[ "$n" == "$(( B - A ))" ]] || { echo "part $PART has $n frames, expected $(( B - A ))"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mode == 'video' && format('part{0}', matrix.part) || format('{0}-stills', inputs.name) }}
          path: out/
          retention-days: 14

  finish:
    if: inputs.mode == 'video'
    needs: [prepare, render]
    runs-on: ubuntu-latest
    env:
      FRAMES: ${{ needs.prepare.outputs.frames }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: "part*", merge-multiple: true }
      - name: Join the parts, add the music, check the result
        run: |
          for i in 0 1 2 3; do echo "file '$PWD/parts/part$i.mp4'"; done > list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy silent.mp4
          vd=$(ffprobe -v error -show_entries format=duration -of csv=p=0 silent.mp4)
          ad=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$AUDIO")
          want=$(python3 -c "print($FRAMES/30)")
          echo "video $vd s, audio $ad s, expected $want s"
          python3 -c "import sys; v,a,w=$vd,$ad,$want; sys.exit(0 if abs(v-w)<0.1 and a>=w-0.15 else 1)" || { echo "length check failed"; exit 1; }
          ffmpeg -v error -y -i silent.mp4 -i "$AUDIO" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 256k -shortest -movflags +faststart "$OUTNAME.mp4"
          fd=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUTNAME.mp4")
          na=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$OUTNAME.mp4" | wc -l)
          echo "final $fd s, audio streams $na"
          python3 -c "import sys; sys.exit(0 if abs($fd-$want)<0.15 and $na==1 else 1)" || { echo "final check failed"; exit 1; }
          cp silent.mp4 "$OUTNAME (silent).mp4"
      - name: Share copy (1280x720, under 25 MB, for phones and messages)
        run: |
          mkdir -p share
          fd=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUTNAME.mp4")
          # video bitrate that fits 24 MB with 160 kb/s audio, at most 2600 kb/s
          vb=$(python3 -c "print(int(min(2600, 24e6*8/1000/$fd - 160)))")
          echo "duration $fd s, video bitrate ${vb}k"
          ffmpeg -v error -y -i "$OUTNAME.mp4" -vf "scale=1280:720:flags=lanczos" -c:v libx264 -preset slow \
            -crf 21 -maxrate "${vb}k" -bufsize "$(( vb * 2 ))k" -pix_fmt yuv420p -g 60 \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 \
            -c:a aac -b:a 160k -movflags +faststart "share/$OUTNAME (share).mp4"
          size=$(stat -c %s "share/$OUTNAME (share).mp4")
          sd=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "share/$OUTNAME (share).mp4")
          wh=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "share/$OUTNAME (share).mp4")
          echo "share copy: $size bytes, $sd s, $wh"
          [[ "$wh" == "1280,720" ]] || { echo "share copy is $wh, expected 1280,720"; exit 1; }
          (( size < 25000000 )) || { echo "share copy is $size bytes, over 25 MB"; exit 1; }
          python3 -c "import sys; sys.exit(0 if abs($sd-$fd)<0.2 else 1)" || { echo "share copy length check failed"; exit 1; }
      - name: Frame sheets for checking the video without downloading it
        continue-on-error: true
        run: |
          mkdir -p sheets
          q=$(python3 -c "print(round($FRAMES/30/4, 3))")
          r=$(python3 -c "print(round(8*30*4/$FRAMES, 5))")
          for k in 0 1 2 3; do
            s=$(python3 -c "print(round($k*$q, 3))")
            ffmpeg -v error -y -ss "$s" -t "$q" -i silent.mp4 \
              -vf "fps=$r,scale=640:-2,tile=4x2" -frames:v 1 -q:v 4 "sheets/sheet$k.jpg" || true
          done
          ls -la sheets
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }} frames
          path: sheets/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: "${{ inputs.name }}*.mp4"
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }} (share)
          path: "share/${{ inputs.name }} (share).mp4"
          retention-days: 30
