name: Archive exact PR116 proof to Drive

on:
  workflow_dispatch:
  push:
    branches:
      - maintenance/claude-handoff-20261122
    paths:
      - .github/workflows/archive-handoff-proof.yml
      - tools/handoff/archive_workflow_artifact.py

permissions:
  contents: read
  actions: read

concurrency:
  group: archive-handoff-proof-14795673158
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the existing Drive client pins
        run: python -m pip install --quiet google-api-python-client==2.187.0 google-auth==2.43.0
      - name: Copy and verify the exact existing proof archive
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_DRIVE_OAUTH: ${{ secrets.GOOGLE_DRIVE_OAUTH }}
        run: python -u tools/handoff/archive_workflow_artifact.py
      - name: Preserve the small transfer receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-tool-proofs-pr116-drive-receipt
          path: work/handoff-proof-archive/receipt.json
          if-no-files-found: warn
          retention-days: 90
